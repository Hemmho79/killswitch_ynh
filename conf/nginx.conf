#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;
location __PATH__/ {

  # Der Spielserver (Node.js) lauscht nur lokal; WebSocket-Verbindungen laufen über __PATH__/ws
  proxy_pass http://127.0.0.1:__PORT__/;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  # Der Server vergleicht den Host-Header mit dem Origin, daher den Host durchreichen
  proxy_set_header Host $host;
  # Der Server begrenzt Verbindungen je IP, daher die echte Adresse setzen (nicht vom Client übernehmen)
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_read_timeout 120s;
}
